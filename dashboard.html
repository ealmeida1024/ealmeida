<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>EA Portfolio · Dashboard</title>
  <link rel="icon" href="https://xznm6a1vqn.ufs.sh/f/mXkbqgXQWqH1w5V9ntc7nRDkPqL8tzdeXUCio29BAvsmcOxT">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    :root {
      --bg: #0e001a; --panel: rgba(20, 6, 40, 0.92); --line: rgba(157, 78, 221, 0.35); --line-strong: #9d4edd;
      --text: #dcd6f7; --muted: #a79fcb; --accent: #7b3fff; --accent-2: #c082ff; --ok: #4ff0d0; --danger: #ff6b9a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text); font-family: "Space Grotesk", sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, rgba(123, 63, 255, 0.25), transparent 60%), var(--bg);
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    header {
      position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      padding: 14px 20px; background: rgba(14, 0, 26, 0.9); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px);
    }
    header h1 { margin: 0 auto 0 0; font-family: "Chakra Petch", sans-serif; font-size: 20px; letter-spacing: 1px; color: #d8b4fe; }
    header h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
    .btn {
      display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--line); background: rgba(12, 12, 24, 0.7); transition: all 0.15s ease; text-decoration: none; font-size: 14px;
    }
    a.btn { color: var(--text); }
    .btn:hover { border-color: var(--accent-2); color: #fff; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: #8f5bff; }
    .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
    .btn.small { padding: 5px 10px; font-size: 13px; }
    .lang-switch { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-strong); border-radius: 18px; }
    .lang-option { border: 0; background: transparent; border-radius: 14px; padding: 4px 10px; cursor: pointer; color: var(--accent-2); font-weight: 700; font-family: "Chakra Petch", sans-serif; }
    .lang-option.active { background: var(--accent); color: #fff; }
    main { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    aside.panel { padding: 12px; align-self: start; position: sticky; top: 80px; }
    @media (max-width: 900px) { aside.panel { position: static; } }
    .list-head { display: flex; gap: 6px; margin-bottom: 10px; }
    .list-head .btn { flex: 1; justify-content: center; }
    .project-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 65vh; overflow-y: auto; }
    .project-item {
      display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 8px;
      border: 1px solid transparent; cursor: pointer;
    }
    .project-item:hover { background: rgba(123, 63, 255, 0.1); }
    .project-item.active { border-color: var(--accent-2); background: rgba(123, 63, 255, 0.18); }
    .project-item > div { min-width: 0; }
    .project-item img { width: 48px; height: 36px; object-fit: cover; border-radius: 4px; background: #000; }
    .project-item b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-item span { font-size: 12px; color: var(--muted); }
    .kind { font-size: 11px; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); font-family: "Chakra Petch", sans-serif; }
    .kind.software { color: #b8fff0; border-color: rgba(79, 240, 208, 0.5); }
    .editor { padding: 20px 22px 28px; }
    .editor h2 { margin: 0 0 4px; font-family: "Chakra Petch", sans-serif; font-size: 22px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; line-height: 1.5; }
    fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 16px; margin: 16px 0 0; }
    legend { padding: 0 6px; font-family: "Chakra Petch", sans-serif; color: #d8b4fe; letter-spacing: 0.5px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .grid.two { grid-template-columns: 1fr 1fr; }
    @media (max-width: 640px) { .grid.two { grid-template-columns: 1fr; } }
    label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
    label .flag { font-size: 11px; color: var(--accent-2); font-family: "Chakra Petch", sans-serif; letter-spacing: 1px; }
    input, textarea, select {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.35); color: var(--text);
    }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; border-color: transparent; }
    textarea { resize: vertical; min-height: 80px; line-height: 1.45; }
    textarea.code { font-family: "Courier New", monospace; font-size: 13px; min-height: 180px; white-space: pre; tab-size: 2; }
    .type-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .type-toggle button { border: 0; background: transparent; padding: 9px 16px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
    .type-toggle button.active { background: var(--accent); color: #fff; }
    .rows { display: flex; flex-direction: column; gap: 10px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; padding: 10px; border-radius: 8px; background: rgba(123, 63, 255, 0.06); border: 1px solid rgba(123, 63, 255, 0.18); }
    .row .thumb { width: 120px; height: 75px; object-fit: cover; border-radius: 6px; background: #000; }
    .row-tools { display: flex; flex-direction: column; gap: 6px; }
    .only-web, .only-software { display: none; }
    .is-web .only-web, .is-software .only-software { display: block; }
    .empty { padding: 60px 20px; text-align: center; color: var(--muted); }
    .footer-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: all 0.25s ease;
      background: #1a0a33; border: 1px solid var(--accent-2); padding: 10px 16px; border-radius: 10px; z-index: 50; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%); }
    .steps { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    code { background: rgba(123, 63, 255, 0.18); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  </style>
</head>
<body>
  <header>
    <h1>DASHBOARD <small data-i18n="dash.subtitle">Portfolio projects</small></h1>
    <div class="lang-switch" role="group" aria-label="Language / Idioma">
      <button type="button" class="lang-option" data-lang="en">EN</button>
      <button type="button" class="lang-option" data-lang="pt">PT</button>
    </div>
    <label class="btn" style="flex-direction: row"><i class="bi bi-upload"></i><span data-i18n="dash.import">Open works.json</span><input type="file" id="importFile" accept=".json,application/json" hidden></label>
    <button class="btn primary" id="downloadBtn"><i class="bi bi-download"></i><span data-i18n="dash.download">Download works.json</span></button>
    <a class="btn" href="index.html" target="_blank"><i class="bi bi-box-arrow-up-right"></i><span data-i18n="dash.site">View site</span></a>
  </header>

  <main>
    <aside class="panel">
      <div class="list-head">
        <button class="btn small" id="newWeb"><i class="bi bi-globe2"></i><span data-i18n="dash.newWeb">Web page</span></button>
        <button class="btn small" id="newSoftware"><i class="bi bi-window-stack"></i><span data-i18n="dash.newSoftware">Software</span></button>
      </div>
      <ul class="project-list" id="projectList"></ul>
      <p class="hint" style="margin-top: 12px" data-i18n-html="dash.howto"></p>
    </aside>

    <section class="panel editor" id="editor"></section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="i18n.js?v=1"></script>
  <script>
    Object.assign(I18N.en, {
      "dash.subtitle": "Portfolio projects",
      "dash.import": "Open works.json",
      "dash.download": "Download works.json",
      "dash.site": "View site",
      "dash.newWeb": "Web page",
      "dash.newSoftware": "Software",
      "dash.howto": "Changes stay in this browser until you download them. To publish: <ol class=\"steps\"><li>Put new images in <code>uploads/</code></li><li>Download <code>works.json</code> and replace <code>data/works.json</code></li><li>Commit and push</li></ol>",
      "dash.empty": "Pick a project on the left, or create a new one.",
      "dash.type": "Project type",
      "dash.typeHint": "Web pages run in the browser and have a live preview and code view. Software (desktop, mobile, games, tools) shows screenshots, features and download or source links.",
      "dash.basics": "Basics",
      "dash.title": "Title",
      "dash.date": "Date",
      "dash.image": "Cover image (path or URL)",
      "dash.tech": "Technologies, comma separated (never translated)",
      "dash.platforms": "Platforms, comma separated (e.g. Windows, Android, macOS, Linux, iOS, Web)",
      "dash.texts": "Texts",
      "dash.textsHint": "Fill in both languages. If one is empty, the other is shown.",
      "dash.tagline": "Tagline (one sentence)",
      "dash.description": "Description",
      "dash.gallery": "Screenshots",
      "dash.galleryHint": "The first screenshot opens first. Put the files in uploads/ and use paths like uploads/my-app-1.jpg.",
      "dash.addShot": "Add screenshot",
      "dash.src": "Image path or URL",
      "dash.caption": "Caption",
      "dash.features": "Features",
      "dash.addFeature": "Add feature",
      "dash.featureTitle": "Feature",
      "dash.featureText": "Explanation",
      "dash.links": "Links (optional)",
      "dash.live": "Live site",
      "dash.repo": "Source code (GitHub)",
      "dash.downloadLink": "Download (release, store, installer)",
      "dash.code": "Code for the live preview",
      "dash.codeHint": "Paste the page's HTML, CSS and JavaScript. The preview builds the page from these three parts.",
      "dash.preview": "Preview on the site",
      "dash.duplicate": "Duplicate",
      "dash.delete": "Delete",
      "dash.deleteConfirm": "Delete this project from the list?",
      "dash.up": "Move up",
      "dash.down": "Move down",
      "dash.remove": "Remove",
      "dash.downloaded": "works.json downloaded. Replace data/works.json with it and push.",
      "dash.imported": "Projects loaded from the file.",
      "dash.importFailed": "That file isn't a valid works.json.",
      "dash.loadFailed": "Couldn't load data/works.json. Open the dashboard through the site (http://), or open the file with the button above.",
      "dash.draft": "Unsaved changes from last time were restored.",
      "dash.discard": "Discard changes",
      "dash.discardConfirm": "Discard every change and reload data/works.json?",
      "dash.untitled": "New project",
    });
    Object.assign(I18N.pt, {
      "dash.subtitle": "Projetos do portefólio",
      "dash.import": "Abrir works.json",
      "dash.download": "Transferir works.json",
      "dash.site": "Ver site",
      "dash.newWeb": "Página web",
      "dash.newSoftware": "Software",
      "dash.howto": "As alterações ficam neste browser até as transferires. Para publicar: <ol class=\"steps\"><li>Coloca as imagens novas em <code>uploads/</code></li><li>Transfere o <code>works.json</code> e substitui <code>data/works.json</code></li><li>Faz commit e push</li></ol>",
      "dash.empty": "Escolhe um projeto à esquerda, ou cria um novo.",
      "dash.type": "Tipo de projeto",
      "dash.typeHint": "As páginas web correm no browser e têm pré-visualização e vista do código. O software (desktop, telemóvel, jogos, ferramentas) mostra capturas, funcionalidades e ligações para transferir ou ver o código.",
      "dash.basics": "Dados principais",
      "dash.title": "Título",
      "dash.date": "Data",
      "dash.image": "Imagem de capa (caminho ou URL)",
      "dash.tech": "Tecnologias, separadas por vírgulas (nunca traduzidas)",
      "dash.platforms": "Plataformas, separadas por vírgulas (ex.: Windows, Android, macOS, Linux, iOS, Web)",
      "dash.texts": "Textos",
      "dash.textsHint": "Preenche as duas línguas. Se uma estiver vazia, é mostrada a outra.",
      "dash.tagline": "Frase de apresentação",
      "dash.description": "Descrição",
      "dash.gallery": "Capturas de ecrã",
      "dash.galleryHint": "A primeira captura aparece primeiro. Coloca os ficheiros em uploads/ e usa caminhos como uploads/a-minha-app-1.jpg.",
      "dash.addShot": "Adicionar captura",
      "dash.src": "Caminho ou URL da imagem",
      "dash.caption": "Legenda",
      "dash.features": "Funcionalidades",
      "dash.addFeature": "Adicionar funcionalidade",
      "dash.featureTitle": "Funcionalidade",
      "dash.featureText": "Explicação",
      "dash.links": "Ligações (opcional)",
      "dash.live": "Site publicado",
      "dash.repo": "Código-fonte (GitHub)",
      "dash.downloadLink": "Transferência (release, loja, instalador)",
      "dash.code": "Código da pré-visualização",
      "dash.codeHint": "Cola o HTML, o CSS e o JavaScript da página. A pré-visualização monta a página a partir destas três partes.",
      "dash.preview": "Pré-visualizar no site",
      "dash.duplicate": "Duplicar",
      "dash.delete": "Eliminar",
      "dash.deleteConfirm": "Eliminar este projeto da lista?",
      "dash.up": "Subir",
      "dash.down": "Descer",
      "dash.remove": "Remover",
      "dash.downloaded": "works.json transferido. Substitui data/works.json por este ficheiro e faz push.",
      "dash.imported": "Projetos carregados a partir do ficheiro.",
      "dash.importFailed": "Esse ficheiro não é um works.json válido.",
      "dash.loadFailed": "Não consegui carregar data/works.json. Abre o dashboard através do site (http://), ou abre o ficheiro com o botão acima.",
      "dash.draft": "As alterações não guardadas da última vez foram recuperadas.",
      "dash.discard": "Descartar alterações",
      "dash.discardConfirm": "Descartar todas as alterações e voltar a carregar data/works.json?",
      "dash.untitled": "Projeto novo",
    });

    const DRAFT_KEY = "portfolioDashboardDraft";
    let projects = [];
    let selected = null;

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const tx = (k) => Lang.t(k);

    function toast(message) {
      const el = $("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove("show"), 3500);
    }

    // Older entries use plain strings; the editor always works with {en, pt}.
    const both = (v) => (v && typeof v === "object" ? { en: v.en || "", pt: v.pt || "" } : { en: v || "", pt: "" });
    function normalize(p) {
      const type = p.type === "software" || p.type === "web" ? p.type : p.html_code || p.css_code || p.js_code ? "web" : "software";
      return {
        ...p,
        type,
        title: both(p.title),
        tagline: both(p.tagline),
        description: both(p.description),
        platforms: Array.isArray(p.platforms) ? p.platforms : [],
        gallery: (p.gallery || []).map((g) => ({ src: g.src || "", caption: both(g.caption) })),
        features: (p.features || []).map((f) => ({ title: both(f.title), text: both(f.text) })),
        links: { live: "", repo: "", download: "", ...(p.links || {}) },
        html_code: p.html_code || "", css_code: p.css_code || "", js_code: p.js_code || "",
      };
    }

    // Clean output: empty fields are dropped, single-language texts become plain strings.
    function exportable() {
      const text = (v) => (!v.pt ? v.en : !v.en ? v.pt : { en: v.en, pt: v.pt });
      return projects.map((p) => {
        const out = { id: p.id, type: p.type, title: text(p.title), date: p.date, image_url: p.image_url, technologies: p.technologies };
        if (p.type === "software" && p.platforms.length) out.platforms = p.platforms;
        if (p.tagline.en || p.tagline.pt) out.tagline = text(p.tagline);
        out.description = text(p.description);
        const gallery = p.gallery.filter((g) => g.src);
        if (p.type === "software" && gallery.length) out.gallery = gallery.map((g) => (g.caption.en || g.caption.pt ? { src: g.src, caption: text(g.caption) } : { src: g.src }));
        const features = p.features.filter((f) => f.title.en || f.title.pt || f.text.en || f.text.pt);
        if (p.type === "software" && features.length) out.features = features.map((f) => ({ title: text(f.title), text: text(f.text) }));
        const links = Object.fromEntries(Object.entries(p.links).filter(([, v]) => v && v.trim()));
        if (Object.keys(links).length) out.links = links;
        if (p.type === "web") { out.html_code = p.html_code; out.css_code = p.css_code; out.js_code = p.js_code; }
        return out;
      });
    }

    function saveDraft() {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify(exportable())); } catch (e) {}
    }

    function load(list, message) {
      projects = list.map(normalize);
      selected = projects[0]?.id ?? null;
      renderList();
      renderEditor();
      if (message) toast(message);
    }

    function current() { return projects.find((p) => p.id === selected); }

    function renderList() {
      $("projectList").innerHTML = projects
        .map((p) => `<li class="project-item ${p.id === selected ? "active" : ""}" data-id="${esc(p.id)}">
            <img src="${esc(p.image_url)}" alt="" onerror="this.style.visibility='hidden'">
            <div><b>${esc(Lang.pick(p.title) || tx("dash.untitled"))}</b><span>${esc(p.date || "")}</span></div>
            <span class="kind ${p.type}">${p.type === "software" ? tx("dash.newSoftware") : "Web"}</span>
          </li>`)
        .join("");
    }

    function bilingual(path, label, multiline) {
      const field = (lang) => {
        const attrs = `data-path="${path}.${lang}"`;
        return `<label><span>${label} <span class="flag">${lang.toUpperCase()}</span></span>${
          multiline ? `<textarea ${attrs} rows="4"></textarea>` : `<input ${attrs}>`
        }</label>`;
      };
      return `<div class="grid two">${field("en")}${field("pt")}</div>`;
    }

    function renderEditor() {
      const p = current();
      const ed = $("editor");
      if (!p) { ed.innerHTML = `<div class="empty">${tx("dash.empty")}</div>`; return; }
      ed.className = `panel editor is-${p.type}`;
      ed.innerHTML = `
        <h2>${esc(Lang.pick(p.title) || tx("dash.untitled"))}</h2>
        <div class="footer-actions" style="margin: 8px 0 4px">
          <div class="type-toggle" role="group" aria-label="${tx("dash.type")}">
            <button type="button" data-type="web" class="${p.type === "web" ? "active" : ""}"><i class="bi bi-globe2"></i>${tx("dash.newWeb")}</button>
            <button type="button" data-type="software" class="${p.type === "software" ? "active" : ""}"><i class="bi bi-window-stack"></i>${tx("dash.newSoftware")}</button>
          </div>
        </div>
        <p class="hint">${tx("dash.typeHint")}</p>

        <fieldset><legend>${tx("dash.basics")}</legend>
          ${bilingual("title", tx("dash.title"))}
          <div class="grid" style="margin-top: 12px">
            <label>${tx("dash.date")}<input type="date" data-path="date"></label>
            <label>${tx("dash.image")}<input data-path="image_url" placeholder="uploads/..."></label>
          </div>
          <div class="grid" style="margin-top: 12px">
            <label>${tx("dash.tech")}<input data-path="technologies" placeholder="HTML, CSS, JS"></label>
            <label class="only-software">${tx("dash.platforms")}<input data-path="platforms" placeholder="Windows, Android"></label>
          </div>
        </fieldset>

        <fieldset><legend>${tx("dash.texts")}</legend>
          <p class="hint">${tx("dash.textsHint")}</p>
          <div class="only-software" style="margin-bottom: 12px">${bilingual("tagline", tx("dash.tagline"))}</div>
          ${bilingual("description", tx("dash.description"), true)}
        </fieldset>

        <fieldset class="only-software"><legend>${tx("dash.gallery")}</legend>
          <p class="hint">${tx("dash.galleryHint")}</p>
          <div class="rows">${p.gallery
            .map((g, i) => `<div class="row">
              <div class="grid" style="grid-template-columns: 120px 1fr">
                <img class="thumb" src="${esc(g.src)}" alt="" onerror="this.style.visibility='hidden'">
                <div>
                  <label>${tx("dash.src")}<input data-path="gallery.${i}.src"></label>
                  <div style="margin-top: 8px">${bilingual(`gallery.${i}.caption`, tx("dash.caption"))}</div>
                </div>
              </div>
              <div class="row-tools">${rowTools("gallery", i, p.gallery.length)}</div>
            </div>`)
            .join("")}</div>
          <button class="btn small" style="margin-top: 10px" data-add="gallery"><i class="bi bi-plus-lg"></i>${tx("dash.addShot")}</button>
        </fieldset>

        <fieldset class="only-software"><legend>${tx("dash.features")}</legend>
          <div class="rows">${p.features
            .map((f, i) => `<div class="row">
              <div>${bilingual(`features.${i}.title`, tx("dash.featureTitle"))}<div style="margin-top: 8px">${bilingual(`features.${i}.text`, tx("dash.featureText"), true)}</div></div>
              <div class="row-tools">${rowTools("features", i, p.features.length)}</div>
            </div>`)
            .join("")}</div>
          <button class="btn small" style="margin-top: 10px" data-add="features"><i class="bi bi-plus-lg"></i>${tx("dash.addFeature")}</button>
        </fieldset>

        <fieldset><legend>${tx("dash.links")}</legend>
          <div class="grid">
            <label>${tx("dash.live")}<input type="url" data-path="links.live" placeholder="https://"></label>
            <label>${tx("dash.repo")}<input type="url" data-path="links.repo" placeholder="https://github.com/..."></label>
            <label class="only-software">${tx("dash.downloadLink")}<input type="url" data-path="links.download" placeholder="https://"></label>
          </div>
        </fieldset>

        <fieldset class="only-web"><legend>${tx("dash.code")}</legend>
          <p class="hint">${tx("dash.codeHint")}</p>
          <div class="grid" style="grid-template-columns: 1fr">
            <label>HTML<textarea class="code" data-path="html_code" spellcheck="false"></textarea></label>
            <label>CSS<textarea class="code" data-path="css_code" spellcheck="false"></textarea></label>
            <label>JavaScript<textarea class="code" data-path="js_code" spellcheck="false"></textarea></label>
          </div>
        </fieldset>

        <div class="footer-actions">
          <button class="btn" data-action="duplicate"><i class="bi bi-copy"></i>${tx("dash.duplicate")}</button>
          <button class="btn" data-action="up"><i class="bi bi-arrow-up"></i>${tx("dash.up")}</button>
          <button class="btn" data-action="down"><i class="bi bi-arrow-down"></i>${tx("dash.down")}</button>
          <button class="btn danger" data-action="delete"><i class="bi bi-trash"></i>${tx("dash.delete")}</button>
          <button class="btn danger" data-action="discard" style="margin-left: auto"><i class="bi bi-arrow-counterclockwise"></i>${tx("dash.discard")}</button>
        </div>`;

      ed.querySelectorAll("[data-path]").forEach((el) => {
        const value = get(p, el.dataset.path);
        el.value = Array.isArray(value) ? value.join(", ") : value ?? "";
      });
    }

    function rowTools(list, i, count) {
      return `<button class="btn small" data-move="${list}.${i}.-1" ${i === 0 ? "disabled" : ""} title="${tx("dash.up")}"><i class="bi bi-arrow-up"></i></button>
        <button class="btn small" data-move="${list}.${i}.1" ${i === count - 1 ? "disabled" : ""} title="${tx("dash.down")}"><i class="bi bi-arrow-down"></i></button>
        <button class="btn small danger" data-remove="${list}.${i}" title="${tx("dash.remove")}"><i class="bi bi-x-lg"></i></button>`;
    }

    function get(obj, path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj); }
    function set(obj, path, value) {
      const keys = path.split(".");
      const last = keys.pop();
      const target = keys.reduce((o, k) => o[k], obj);
      target[last] = value;
    }

    function create(type) {
      const id = Math.max(0, ...projects.map((p) => Number(p.id) || 0)) + 1;
      const p = normalize({ id, type, title: "", date: new Date().toISOString().slice(0, 10), image_url: "", technologies: "" });
      if (type === "software") p.gallery.push({ src: "", caption: { en: "", pt: "" } });
      projects.unshift(p);
      selected = id;
      renderList();
      renderEditor();
      saveDraft();
      $("editor").querySelector("input")?.focus();
    }

    // ---- events
    $("projectList").addEventListener("click", (e) => {
      const item = e.target.closest(".project-item");
      if (!item) return;
      selected = projects.find((p) => String(p.id) === item.dataset.id)?.id ?? null;
      renderList();
      renderEditor();
    });

    $("editor").addEventListener("input", (e) => {
      const el = e.target.closest("[data-path]");
      const p = current();
      if (!el || !p) return;
      const path = el.dataset.path;
      const value = path === "platforms" ? el.value.split(",").map((s) => s.trim()).filter(Boolean) : el.value;
      set(p, path, value);
      if (path.startsWith("title") || path === "image_url" || path === "date") renderList();
      if (path.startsWith("title")) $("editor").querySelector("h2").textContent = Lang.pick(p.title) || tx("dash.untitled");
      if (/^gallery\.\d+\.src$/.test(path)) el.closest(".row").querySelector(".thumb").src = el.value;
      saveDraft();
    });

    $("editor").addEventListener("click", (e) => {
      const p = current();
      if (!p) return;
      const typeBtn = e.target.closest("[data-type]");
      const add = e.target.closest("[data-add]");
      const move = e.target.closest("[data-move]");
      const remove = e.target.closest("[data-remove]");
      const action = e.target.closest("[data-action]")?.dataset.action;

      if (typeBtn) { p.type = typeBtn.dataset.type; }
      else if (add) {
        if (add.dataset.add === "gallery") p.gallery.push({ src: "", caption: { en: "", pt: "" } });
        else p.features.push({ title: { en: "", pt: "" }, text: { en: "", pt: "" } });
      } else if (move) {
        const [list, i, dir] = move.dataset.move.split(".");
        const a = Number(i), b = a + Number(dir);
        [p[list][a], p[list][b]] = [p[list][b], p[list][a]];
      } else if (remove) {
        const [list, i] = remove.dataset.remove.split(".");
        p[list].splice(Number(i), 1);
      } else if (action === "duplicate") {
        const copy = normalize(JSON.parse(JSON.stringify(p)));
        copy.id = Math.max(0, ...projects.map((x) => Number(x.id) || 0)) + 1;
        projects.splice(projects.indexOf(p), 0, copy);
        selected = copy.id;
      } else if (action === "up" || action === "down") {
        const i = projects.indexOf(p), j = i + (action === "up" ? -1 : 1);
        if (j < 0 || j >= projects.length) return;
        [projects[i], projects[j]] = [projects[j], projects[i]];
      } else if (action === "delete") {
        if (!confirm(tx("dash.deleteConfirm"))) return;
        const i = projects.indexOf(p);
        projects.splice(i, 1);
        selected = projects[Math.min(i, projects.length - 1)]?.id ?? null;
      } else if (action === "discard") {
        if (!confirm(tx("dash.discardConfirm"))) return;
        try { localStorage.removeItem(DRAFT_KEY); } catch (err) {}
        return fetchWorks();
      } else return;

      renderList();
      renderEditor();
      saveDraft();
    });

    $("newWeb").addEventListener("click", () => create("web"));
    $("newSoftware").addEventListener("click", () => create("software"));

    $("downloadBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(exportable(), null, 2) + "\n"], { type: "application/json" });
      const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "works.json" });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      toast(tx("dash.downloaded"));
    });

    $("importFile").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file) return;
      try {
        const list = JSON.parse(await file.text());
        if (!Array.isArray(list)) throw new Error();
        load(list, tx("dash.imported"));
        saveDraft();
      } catch (err) {
        toast(tx("dash.importFailed"));
      }
    });

    Lang.onChange(() => { renderList(); renderEditor(); });

    function fetchWorks() {
      fetch("data/works.json", { cache: "no-cache" })
        .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
        .then((list) => load(list))
        .catch(() => { load([]); toast(tx("dash.loadFailed")); });
    }

    let draft = null;
    try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch (e) {}
    if (Array.isArray(draft)) load(draft, tx("dash.draft"));
    else fetchWorks();
  </script>
</body>
</html>
